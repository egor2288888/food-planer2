<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Planer — планировщик питания</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1f7a3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Food Planer">
<style>
  :root { --a:#34c759; --a2:#1f7a3c; --a3:#0b3d1e; --card:rgba(255,255,255,.9); --ink:#1c2b20; --muted:#5f6f63; --line:#e3ebe4; --pale:#f1f8f2; --tile:#fff; --ghost:rgba(0,0,0,.08); }
  [data-scheme=blue]   { --a:#0a84ff; --a2:#0a5bb5; --a3:#06223f; }
  [data-scheme=orange] { --a:#ff9500; --a2:#c76a00; --a3:#4a2a00; }
  [data-scheme=purple] { --a:#af52de; --a2:#7a2fb0; --a3:#2a1140; }
  [data-theme=dark] { --card:rgba(24,34,28,.92); --ink:#e9f3ec; --muted:#9fb3a4; --line:#2f3f35; --pale:#22302a; --tile:#243229; --ghost:rgba(255,255,255,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(160deg, var(--a3), var(--a2) 55%, var(--a)) fixed; min-height: 100vh; position: relative; }
  [data-theme=dark] body::before { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,.45); }
  .bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg span { position: absolute; opacity: .2; user-select: none; animation: float 12s ease-in-out infinite alternate; }
  @keyframes float { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-26px) rotate(8deg); } }
  .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 16px; }
  header { text-align: center; color: #fff; padding: 12px 0 4px; }
  header h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
  header p { margin: 4px 0 0; opacity: .85; }
  .seg { display: flex; flex-wrap: wrap; background: rgba(255,255,255,.18); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 14px; padding: 4px; margin: 14px auto; max-width: 620px; gap: 4px; }
  .seg button { flex: 1 1 120px; background: transparent; color: #fff; border-radius: 10px; padding: 9px; font-weight: 600; font-size: 14px; }
  .seg button.on { background: #fff; color: var(--a3); }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 6px 0 12px; }
  .step { padding: 6px 12px; border-radius: 20px; background: rgba(255,255,255,.2); color: #fff; font-size: 13px; cursor: pointer; }
  .step.active { background: #fff; color: var(--a3); font-weight: 600; }
  .step.done { background: rgba(255,255,255,.4); }
  .card { background: var(--card); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
    border-radius: 22px; padding: 18px; margin-bottom: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.2); }
  h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.3px; }
  h3 { margin: 14px 0 8px; font-size: 17px; }
  button { font: inherit; background: var(--a); color: #fff; border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer; font-weight: 600; transition: transform .15s, opacity .15s; }
  button:hover { opacity: .92; }
  button:active { transform: scale(.96); }
  button.ghost { background: var(--ghost); color: var(--ink); }
  button.small { padding: 5px 11px; font-size: 13px; border-radius: 9px; }
  input[type=number], input[type=text] { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--tile); color: var(--ink); outline: none; }
  input[type=number] { width: 130px; }
  input[type=text] { flex: 1; min-width: 180px; }
  input:focus { border-color: var(--a); }
  input[type=checkbox], input[type=radio] { accent-color: var(--a); width: 18px; height: 18px; }
  input[type=range] { width: 100%; accent-color: var(--a); }
  .muted { color: var(--muted); font-size: 14px; }
  .nav { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--tile); color: var(--ink); border-radius: 12px; padding: 8px 12px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .chip:has(input:checked) { border-color: var(--a); background: var(--pale); }
  .counter { display: flex; align-items: center; gap: 18px; font-size: 26px; }
  .counter span { min-width: 50px; text-align: center; font-weight: 700; }
  .day-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  .meal { border-top: 1px solid var(--line); padding: 10px 0; }
  .meal-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .meal-top b { flex: 1; min-width: 200px; }
  .tag { background: #fff1e0; color: #c75000; border-radius: 8px; padding: 3px 9px; font-size: 13px; font-weight: 600; }
  .tag.ok { background: #e3f5e7; color: #1e7a36; }
  .tag.miss { background: #fde9e7; color: #b3261e; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--a); font-weight: 600; }
  .alert { background: rgba(255,193,7,.2); border-radius: 14px; padding: 10px 12px; margin: 8px 0; color: var(--ink); }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .stats div { background: var(--pale); padding: 12px; border-radius: 16px; display: flex; flex-direction: column; }
  .stats b { font-size: 20px; margin-top: 2px; }
  .good { color: #1e9a46; } .bad { color: #e0453a; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 9px; border-bottom: 1px solid var(--line); text-align: left; }
  tr.owned td { color: var(--muted); }
  tr.owned td:nth-child(2) { text-decoration: line-through; }
  .thumb { position: relative; width: 84px; height: 62px; min-width: 84px; border-radius: 12px; background: var(--pale); display: flex; align-items: center; justify-content: center; font-size: 30px; overflow: hidden; flex-shrink: 0; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .fridge-input { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fridge-input input[type=number] { width: 110px; }
  .have { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .have span { background: var(--pale); color: var(--ink); border-radius: 999px; padding: 6px 10px; font-size: 14px; display: flex; gap: 6px; align-items: center; }
  .have button { background: none; color: var(--ink); padding: 0 2px; font-size: 16px; line-height: 1; }
  .quick button { background: var(--tile); color: var(--a); border: 1px solid var(--line); padding: 6px 10px; font-size: 13px; margin: 3px; }
  .dish-card { display: flex; gap: 12px; align-items: center; background: var(--tile); border-radius: 18px; padding: 10px; margin-bottom: 8px; }
  .dish-card .info { flex: 1; min-width: 0; }
  .ings { list-style: none; padding: 0; margin: 6px 0; font-size: 14px; }
  .ings .ok { color: #1e7a36; } .ings .no { color: #b3261e; }
  [data-theme=dark] .ings .ok { color: #6fd58e; } [data-theme=dark] .ings .no { color: #ff8a80; }
  .opt { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .sw.on { border-color: var(--ink); }
  .rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 6px; }
  .row { display: flex; align-items: center; gap: 8px; background: var(--tile); border-radius: 12px; padding: 6px 8px; }
  .star { background: none; color: #f5b300; font-size: 20px; padding: 0 4px; line-height: 1; }
  .star.off { color: var(--muted); }
  @media print { .seg, .steps, .nav, button, input[type=checkbox], .bg { display: none; } }
</style>
</head>

  {id:136,n:'Наполеон',m:'dessert',t:'veg',k:450,b:7,f:26,c:46,i:'🍰',kw:'napoleon cake',g:[['Мука',100],['Сливочное масло',50],['Молоко',150],['Сахар',40],['Яйца',40]],s:'Запечь тонкие коржи из теста, собрать слоями с заварным кремом.'}
];

/* ============ СОСТОЯНИЕ ============ */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const state = {
  mode: 'plan', step: 1,
  budget: 5000, persons: 2, days: [...DAYS], mains: 2, snacks: 1, dessert: false, diet: 'any', kcal: 'normal',
  selected: {}, plan: null, warnings: [], owned: {},
  have: LS.get('fp-stock', {}),                                   // {продукт: граммы}
  block: LS.get('fp-block', { allergens: [], dislikes: '' }),     // ограничения
  history: LS.get('fp-history', []),
  theme: LS.get('fp-theme', 'light'),
  scheme: LS.get('fp-scheme', 'green'),
  fMeal: 'all',
  fav: LS.get('fp-fav', []),       // id любимых блюд
  favMode: 'off',                  // off | more | only
  onlyFav: false,                  // на шаге 5: только любимые
  q: '',                           // поиск на шаге 5
  cat: 'breakfast'                 // вкладка на шаге 5
};

const app = document.getElementById('app');
const stepsEl = document.getElementById('steps');
const modesEl = document.getElementById('modes');
const STEP_NAMES = ['Бюджет','Персоны','Дни','Питание','Блюда','Меню','Итог'];

/* ============ ХЕЛПЕРЫ ============ */
const dish = id => DISHES.find(d => d.id === id);
const fmt = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const fmtG = g => g >= 1000 ? (g/1000).toLocaleString('ru-RU', {maximumFractionDigits:2}) + ' кг' : Math.round(g) + ' г';
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const norm = s => String(s).toLowerCase().replace(/ё/g, 'е').trim();
// Название продукта: точное совпадение, иначе по первым 4 буквам
const canon = v => {
  const n = norm(v);
  const exact = Object.keys(PRICES).find(k => norm(k) === n);
  if (exact) return exact;
  const near = Object.keys(PRICES).find(k => norm(k).slice(0, 4) === n.slice(0, 4));
  return near || (String(v).charAt(0).toUpperCase() + String(v).slice(1));
};
const dishCost = d => d.g.reduce((s, [n, g]) => s + g/1000 * (PRICES[n] || 0), 0);
const dishCostTotal = d => dishCost(d) * state.persons;
const radios = (name, obj, cur) => Object.entries(obj).map(([k, v]) =>
  `<label class="chip"><input type="radio" name="${name}" value="${k}" ${cur==k?'checked':''} onchange="state.${name}=this.value"><span>${v}</span></label>`
).join('');

const blockedNames = () => state.block.dislikes.split(',').map(s => s.trim()).filter(Boolean).map(canon);
function blockedIng(name) {
  if (blockedNames().some(x => norm(x) === norm(name))) return true;
  return state.block.allergens.some(a => ALLERGENS[a].list.includes(name));
}
const dishBlocked = d => d.g.some(([n]) => blockedIng(n));

function dietOk(d, diet) {
  if (diet === 'any')  return true;
  if (diet === 'meat') return d.t === 'meat';
  if (diet === 'fish') return d.t === 'fish';
  if (diet === 'mix')  return d.t === 'meat' || d.t === 'fish';
  if (diet === 'veg')  return d.t === 'veg';
  return true;
}

/* ============ ЦЕНЫ ИЗ ФАЙЛА ============ */
async function loadPrices() {
  try {
    const r = await fetch('prices.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    PRICES = { ...DEFAULT_PRICES, ...(await r.json()) };
    priceSource = 'файл prices.json';
  } catch (e) {
    priceSource = 'встроенные (файл prices.json не найден или открыт без сервера)';
  }
  updateDatalist();
  render();
}
function updateDatalist() {
  document.getElementById('ings').innerHTML = Object.keys(PRICES).map(k => `<option value="${k}">`).join('');
}

/* ============ КОЛИЧЕСТВО ПРОДУКТОВ ============ */
const haveAmt = name => state.have[canon(name)] || 0;
function setHave(name, g) {
  state.have[canon(name)] = g;
  LS.set('fp-stock', state.have);
  render();
  setTimeout(() => document.getElementById('hInp')?.focus(), 0);
}
function addHave() {
  const n = document.getElementById('hInp').value.trim();
  const g = +document.getElementById('gInp').value;
  if (!n || !(g > 0)) return;
  setHave(n, g);
}
function removeHave(n) { delete state.have[n]; LS.set('fp-stock', state.have); render(); }
function clearHave() { state.have = {}; LS.set('fp-stock', state.have); render(); }
// Сколько граммов не хватает на текущее число персон
function dishMissing(d) {
  return d.g.map(([n, g]) => ({ n, need: g * state.persons, have: haveAmt(n) }))
    .filter(x => x.have < x.need)
    .map(x => ({ ...x, lack: x.need - x.have }));
}

/* ============ ЛЮБИМЫЕ ============ */
function toggleFav(id) {
  state.fav = state.fav.includes(id) ? state.fav.filter(x => x !== id) : [...state.fav, id];
  LS.set('fp-fav', state.fav);
  render();
}
function setQ(v) {
  state.q = v;
  render();
  const el = document.getElementById('qInp');
  el.focus();
  el.setSelectionRange(v.length, v.length);
}
function setCat(k) { state.cat = k; render(); }

/* ============ ГЕНЕРАЦИЯ ПЛАНА ============ */
function getPool(type) {
  const warns = [];
  const all = DISHES.filter(d => d.m === type && !dishBlocked(d));
  if (!all.length) return { list: [], warns };
  let base = all.filter(d => state.selected[d.id] !== false);
  if (!base.length) { base = all; warns.push(`В категории «${MEALS[type]}» не выбрано ни одного блюда — использованы все доступные.`); }
  let p = base.filter(d => dietOk(d, state.diet));
  if (!p.length) { p = base; warns.push(`Для режима «${DIETS[state.diet]}» нет подходящих блюд в категории «${MEALS[type]}» — показаны остальные.`); }
  if (state.kcal !== 'normal' && p.length > 2) {
    const s = [...p].sort((a, b) => a.k - b.k);
    const half = Math.ceil(s.length / 2);
    p = state.kcal === 'more' ? s.slice(half) : s.slice(0, half);
  }
  const favs = p.filter(d => state.fav.includes(d.id));
  if (state.favMode === 'only') {
    if (favs.length) p = favs;
    else warns.push(`В категории «${MEALS[type]}» нет любимых блюд — показаны все.`);
  } else if (state.favMode === 'more' && favs.length) {
    p = [...p, ...favs, ...favs];   // любимые попадают в меню чаще
  }
  return { list: p, warns };
}

function totalCost() {
  return state.plan.reduce((s, d) => s + d.meals.reduce((a, m) => a + dishCostTotal(dish(m.dishId)), 0), 0);
}

function balanceBudget(pools) {
  let guard = 0;
  while (totalCost() > state.budget && guard++ < 500) {
    let best = null;
    state.plan.forEach(d => d.meals.forEach(m => {
      const cur = dishCostTotal(dish(m.dishId));
      const alt = pools[m.type].filter(x => dishCostTotal(x) < cur);
      if (alt.length && (!best || cur > best.cur)) best = { m, cur, alt };
    }));
    if (!best) break;
    best.m.dishId = best.alt.reduce((a, b) => dishCostTotal(b) < dishCostTotal(a) ? b : a).id;
  }
}

function generatePlan() {
  state.warnings = [];
  const pools = {};
  const perDay = [...MAINS[state.mains], ...Array(state.snacks).fill('snack'), ...(state.dessert ? ['dessert'] : [])];
  for (const t of new Set(perDay)) {
    const r = getPool(t);
    pools[t] = r.list;
    r.warns.forEach(w => { if (!state.warnings.includes(w)) state.warnings.push(w); });
    if (!r.list.length) return false;
  }
  state.plan = state.days.map(day => ({
    day, meals: perDay.map(t => ({ type: t, dishId: pick(pools[t]).id }))
  }));
  balanceBudget(pools);
  if (totalCost() > state.budget) {
    const minPer = t => Math.min(...pools[t].map(dishCostTotal));
    const minTotal = state.plan.reduce((s, d) => s + d.meals.reduce((a, m) => a + minPer(m.type), 0), 0);
    state.warnings.push(`Бюджет слишком мал: минимальная стоимость меню ≈ ${fmt(minTotal)}. Увеличьте бюджет или уберите часть дней или перекусов.`);
  }
  return true;
}

function saveHistory() {
  state.history.unshift({
    date: new Date().toLocaleString('ru-RU', { dateStyle: 'short', timeStyle: 'short' }),
    persons: state.persons, budget: state.budget, total: Math.round(totalCost()),
    plan: state.plan.map(d => ({ day: d.day, meals: d.meals.map(m => ({ type: m.type, dishId: m.dishId })) }))
  });
  state.history = state.history.slice(0, 20);
  LS.set('fp-history', state.history);
}

function toMenu() {
  if (!generatePlan()) return alert('Ограничения исключили все блюда в одной из категорий. Ослабьте их в «Настройках».');
  saveHistory();
  go(6);
}

function swapDish(di, mi) {
  const m = state.plan[di].meals[mi];
  const others = getPool(m.type).list.filter(d => d.id !== m.dishId);
  if (!others.length) return alert('Других блюд в этой категории нет.');
  m.dishId = pick(others).id;
  render();
}

const sumDay = meals => meals.reduce((s, m) => {
  const d = dish(m.dishId);
  return { k: s.k + d.k, b: s.b + d.b, f: s.f + d.f, c: s.c + d.c };
}, { k: 0, b: 0, f: 0, c: 0 });
const kbzhu = o => `Б ${Math.round(o.b)} · Ж ${Math.round(o.f)} · У ${Math.round(o.c)}`;

/* ============ СПИСОК ПОКУПОК ============ */
function shoppingList() {
  const map = {};
  state.plan.forEach(d => d.meals.forEach(m =>
    dish(m.dishId).g.forEach(([n, g]) => map[n] = (map[n] || 0) + g * state.persons)));
  return Object.entries(map)
    .map(([name, g]) => ({ name, g, cost: g/1000 * (PRICES[name] || 0) }))
    .sort((a, b) => b.cost - a.cost);
}
function toggleOwned(name) { state.owned[name] = !state.owned[name]; render(); }

function shoppingText() {
  const list = shoppingList().filter(x => !state.owned[x.name]);
  const total = list.reduce((s, x) => s + x.cost, 0);
  return `Список покупок (${state.persons} чел., ${state.plan.length} дн.)\n\n` +
    list.map(x => `- ${x.name}: ${fmtG(x.g)} (${fmt(x.cost)})`).join('\n') +
    `\n\nИтого к покупке: ${fmt(total)}`;
}
function fallbackCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
}
function copyList() {
  const t = shoppingText();
  const done = () => alert('Список скопирован');
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(() => { fallbackCopy(t); done(); });
  else { fallbackCopy(t); done(); }
}
function downloadList() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([shoppingText()], { type: 'text/plain;charset=utf-8' }));
  a.download = 'spisok-pokupok.txt';
  a.click();
}
function shareList() {
  if (navigator.share) navigator.share({ title: 'Список покупок', text: shoppingText() }).catch(() => {});
}

/* ============ ИСТОРИЯ ============ */
function openHistory(i) {
  const h = state.history[i];
  state.persons = h.persons; state.budget = h.budget;
  state.plan = h.plan.map(d => ({ day: d.day, meals: d.meals.map(m => ({ ...m })) }));
  state.owned = {};
  state.mode = 'plan'; state.step = 6;
  render(); window.scrollTo(0, 0);
}
function delHistory(i) { state.history.splice(i, 1); LS.set('fp-history', state.history); render(); }

/* ============ ОФОРМЛЕНИЕ И ОГРАНИЧЕНИЯ ============ */
function applyTheme() {
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.dataset.scheme = state.scheme;
}
function setTheme(t) { state.theme = t; LS.set('fp-theme', t); applyTheme(); render(); }
function setScheme(s) { state.scheme = s; LS.set('fp-scheme', s); applyTheme(); render(); }
function toggleAllergen(k, on) {
  const a = state.block.allergens.filter(x => x !== k);
  state.block.allergens = on ? [...a, k] : a;
  LS.set('fp-block', state.block);
  render();
}
function saveDislikes() {
  state.block.dislikes = document.getElementById('dis').value;
  LS.set('fp-block', state.block);
  alert('Сохранено. Составьте меню заново, чтобы применить к плану.');
  render();
}

/* ============ ВКЛАДКА «ЧТО ПРИГОТОВИТЬ» ============ */
function dishCard(d) {
  const miss = dishMissing(d);
  const rows = d.g.map(([n, g]) => {
    const need = g * state.persons, h = haveAmt(n), ok = h >= need;
    return `<li class="${ok?'ok':'no'}">${ok?'✓':'✗'} ${n}: нужно ${fmtG(need)}, есть ${fmtG(h)}${ok ? '' : ` · не хватает ${fmtG(need - h)}`}</li>`;
  }).join('');
  return `
    <div class="dish-card">
      ${thumb(d)}
      <div class="info">
        <b>${d.n}</b> <span class="tag ${miss.length?'miss':'ok'}">${miss.length ? 'не хватает: ' + miss.length : 'всё есть'}</span>
        <div class="muted">${MEALS[d.m]} · ${d.k} ккал · ${kbzhu(d)}</div>
        <details><summary>Состав и рецепт</summary><ul class="ings">${rows}</ul><p>${d.s}</p></details>
      </div>
    </div>`;
}

function fridgeScreen() {
  const pool = DISHES.filter(d => !dishBlocked(d) && (state.fMeal === 'all' || d.m === state.fMeal))
    .map(d => ({ d, miss: dishMissing(d).length }));
  const ready = pool.filter(x => !x.miss).map(x => x.d);
  const rest = pool.filter(x => x.miss).sort((a, b) => a.miss - b.miss).map(x => x.d);
  const list = ready.length >= 6 ? ready : [...ready, ...rest.slice(0, 12 - ready.length)];
  const hasStock = Object.keys(state.have).length > 0;

  const hint = !hasStock ? 'Добавьте продукты и сколько граммов есть дома.'
    : !ready.length ? 'Полностью готовых блюд пока нет. Ниже блюда, которым не хватает меньше всего продуктов.'
    : `Можно приготовить без докупки: ${ready.length}.`;

  const stock = hasStock
    ? Object.entries(state.have).map(([n, g]) => `<span>${n} ${fmtG(g)}<button onclick="removeHave('${n}')">×</button></span>`).join('')
    : '<span class="muted">Пока ничего не добавлено</span>';
  const quick = COMMON.filter(c => !state.have[canon(c)]).map(c => `<button onclick="setHave('${c}', 500)">+ ${c}</button>`).join('');
  const filters = [['all','Все'], ...Object.entries(MEALS)].map(([k, v]) =>
    `<label class="chip"><input type="radio" name="fm" ${state.fMeal===k?'checked':''} onchange="state.fMeal='${k}';render()"><span>${v}</span></label>`).join('');

  return `
    <section class="card">
      <h2>Что приготовить из того, что есть</h2>
      <p class="muted">Введите продукт и сколько граммов есть дома. Блюда считаются на ${state.persons} чел. (число персон меняется на шаге 2 плана).</p>
      <div class="fridge-input">
        <input id="hInp" type="text" list="ings" placeholder="Например: курица" onkeydown="if(event.key==='Enter')addHave()">
        <input id="gInp" type="number" min="1" value="500"> <span class="muted">г</span>
        <button onclick="addHave()">Добавить</button>
        <button class="ghost" onclick="clearHave()">Очистить</button>
      </div>
      <div class="have">${stock}</div>
      <h3>Быстрый выбор (500 г)</h3>
      <div class="quick">${quick}</div>
      <h3>Тип приёма пищи</h3>
      <div class="chips">${filters}</div>
    </section>
    <section class="card">
      <p><b>${hint}</b></p>
      ${list.map(dishCard).join('')}
      <p class="muted">Совпадение по названию продукта. Блюда с аллергенами и нелюбимыми продуктами скрыты.</p>
    </section>`;
}

/* ============ ЭКРАНЫ ПЛАНИРОВЩИКА ============ */
function setBudget(v) {
  let n = Math.round(+v); if (!n || n < 1) n = 1; if (n > 50000) n = 50000;
  state.budget = n;
  document.getElementById('bRange').value = n;
  document.getElementById('bNum').value = n;
  document.getElementById('bDay').textContent = `≈ ${fmt(n / Math.max(1, state.days.length))} в день (дней выбрано: ${state.days.length})`;
}
function setPersons(d) {
  state.persons = Math.min(10, Math.max(1, state.persons + d));
  document.getElementById('pVal').textContent = state.persons;
}
function toggleDay(d, on) { state.days = DAYS.filter(x => x === d ? on : state.days.includes(x)); }
function selectAll(meal, on) { DISHES.filter(d => d.m === meal).forEach(d => state.selected[d.id] = on); render(); }
function go(n) { state.step = n; render(); window.scrollTo(0, 0); }
function setMode(m) { state.mode = m; render(); window.scrollTo(0, 0); }
function resetAll() {
  Object.assign(state, { step:1, budget:5000, persons:2, days:[...DAYS], mains:2, snacks:1, dessert:false, diet:'any', kcal:'normal', selected:{}, plan:null, warnings:[], owned:{} });
  render();
}

const screens = {
  1: () => `
    <section class="card">
      <h2>1. Бюджет на весь период</h2>
      <p class="muted">Сколько готовы потратить на питание за все выбранные дни (от 1 до 50 000 ₽)</p>
      <input type="range" id="bRange" min="1" max="50000" step="1" value="${state.budget}" oninput="setBudget(this.value)">
      <div class="chips">
        <input type="number" id="bNum" min="1" max="50000" value="${state.budget}" onchange="setBudget(this.value)"> <b>₽</b>
      </div>
      <p class="muted" id="bDay">≈ ${fmt(state.budget / Math.max(1, state.days.length))} в день (дней выбрано: ${state.days.length})</p>
      <div class="nav"><span></span><button onclick="go(2)">Далее →</button></div>
    </section>`,

  2: () => `
    <section class="card">
      <h2>2. Количество персон</h2>
      <p class="muted">Для скольких человек готовим (от 1 до 10)</p>
      <div class="counter">
        <button onclick="setPersons(-1)">−</button>
        <span id="pVal">${state.persons}</span>
        <button onclick="setPersons(1)">+</button>
      </div>
      <div class="nav"><button class="ghost" onclick="go(1)">← Назад</button><button onclick="go(3)">Далее →</button></div>
    </section>`,

  3: () => `
    <section class="card">
      <h2>3. Дни недели</h2>
      <p class="muted">На какие дни нужно меню</p>
      <div class="chips">
        ${DAYS.map((d, i) => `
          <label class="chip"><input type="checkbox" ${state.days.includes(d)?'checked':''}
            onchange="toggleDay('${d}', this.checked)"><span>${DAYS_FULL[i]}</span></label>`).join('')}
      </div>
      <div class="nav">
        <button class="ghost" onclick="go(2)">← Назад</button>
        <button onclick="state.days.length ? go(4) : alert('Выберите хотя бы один день')">Далее →</button>
      </div>
    </section>`,

  4: () => `
    <section class="card">
      <h2>4. Приёмы пищи и предпочтения</h2>
      <h3>Основных приёмов в день</h3>
      <div class="chips">${[1,2,3].map(n => `
        <label class="chip"><input type="radio" name="mains" value="${n}" ${state.mains==n?'checked':''} onchange="state.mains=+this.value"><span>${MAIN_LABEL[n]}</span></label>`).join('')}
      </div>
      <h3>Перекусов в день</h3>
      <div class="chips">${[0,1,2,3].map(n => `
        <label class="chip"><input type="radio" name="snacks" value="${n}" ${state.snacks===n?'checked':''} onchange="state.snacks=+this.value"><span>${n}</span></label>`).join('')}
      </div>
      <div class="chips">
        <label class="chip"><input type="checkbox" ${state.dessert?'checked':''} onchange="state.dessert=this.checked"><span>🍰 Добавить десерт</span></label>
      </div>
      <h3>Любимые блюда (★ на шаге 5)</h3>
      <div class="chips">${radios('favMode', FAV_MODE, state.favMode)}</div>
      <h3>Что едим</h3>
      <div class="chips">${radios('diet', DIETS, state.diet)}</div>
      <h3>Калорийность</h3>
      <div class="chips">${radios('kcal', KCAL, state.kcal)}</div>
      <div class="nav">
        <button class="ghost" onclick="go(3)">← Назад</button>
        <button onclick="go(5)">Далее →</button>
      </div>
    </section>`,

  5: () => {
    const keys = [...new Set([...MAINS[state.mains], 'snack', ...(state.dessert ? ['dessert'] : [])])];
    const cat = keys.includes(state.cat) ? state.cat : keys[0];
    const q = norm(state.q || '');
    const all = DISHES.filter(d => d.m === cat && !dishBlocked(d));
    const list = all.filter(d => (!q || norm(d.n).includes(q)) && (!state.onlyFav || state.fav.includes(d.id)));
    const selCount = all.filter(d => state.selected[d.id] !== false).length;
    const hidden = DISHES.filter(dishBlocked).length;
    const qVal = (state.q || '').replace(/"/g, '&quot;');
    return `
    <section class="card">
      <h2>5. Выберите блюда</h2>
      <p class="muted">Снимите галочки с ненужных. ☆ — отметить любимое. Режим «чаще» или «только любимые» настраивается на шаге 4.${hidden ? ` Скрыто по ограничениям: ${hidden}.` : ''}</p>
      <div class="fridge-input">
        <input id="qInp" type="text" value="${qVal}" placeholder="🔍 Поиск блюда" oninput="setQ(this.value)">
        <label class="chip"><input type="checkbox" ${state.onlyFav?'checked':''} onchange="state.onlyFav=this.checked;render()"><span>★ Только любимые</span></label>
      </div>
      <div class="chips" style="margin-top:10px">
        ${keys.map(k => `<label class="chip"><input type="radio" name="cat" ${k===cat?'checked':''} onchange="setCat('${k}')"><span>${MEALS[k]}</span></label>`).join('')}
      </div>
      <p class="muted">${MEALS[cat]}: выбрано ${selCount} из ${all.length}
        <button class="small" onclick="selectAll('${cat}', true)">Все</button>
        <button class="small ghost" onclick="selectAll('${cat}', false)">Ни одного</button>
      </p>
      <div class="rows">
        ${list.map(d => {
          const fav = state.fav.includes(d.id);
          return `
          <div class="row">
            <button class="star ${fav?'':'off'}" title="Любимое" onclick="toggleFav(${d.id})">${fav?'★':'☆'}</button>
            <input type="checkbox" ${state.selected[d.id]!==false?'checked':''} onchange="state.selected[${d.id}]=this.checked">
            <div style="flex:1;min-width:0">
              <b>${d.i} ${d.n}</b>
              <div class="muted">${d.k} ккал · ${fmt(dishCost(d))} на 1 чел.</div>
            </div>
          </div>`;
        }).join('') || '<p class="muted">Ничего не найдено</p>'}
      </div>
      <div class="nav">
        <button class="ghost" onclick="go(4)">← Назад</button>
        <button onclick="toMenu()">Составить меню →</button>
      </div>
    </section>`;
  },

  6: () => {
    const warn = state.warnings.map(w => `<div class="alert">⚠️ ${w}</div>`).join('');
    const stale = state.plan.some(d => d.meals.some(m => dishBlocked(dish(m.dishId))));
    return `
    <section>
      <div class="card">
        <h2>6. Ваше меню</h2>
        <p class="muted">Персон: ${state.persons} · дней: ${state.plan.length} · ${MAIN_LABEL[state.mains]} · перекусов: ${state.snacks}${state.dessert ? ' · с десертом' : ''} · ${DIETS[state.diet]} · ${KCAL[state.kcal]} · бюджет ${fmt(state.budget)}</p>
        ${warn}
        ${stale ? '<div class="alert">⚠️ В меню есть блюда, которые теперь исключены вашими ограничениями. Нажмите «Изменить блюда» и составьте меню заново.</div>' : ''}
        <p class="muted">Стоимость в карточках указана на всех персон, ккал и КБЖУ — на 1 порцию.</p>
      </div>
      ${state.plan.map((d, di) => {
        const day = sumDay(d.meals);
        const dayCost = d.meals.reduce((s, m) => s + dishCostTotal(dish(m.dishId)), 0);
        return `
        <div class="card">
          <div class="day-head">
            <h3>${DAYS_FULL[DAYS.indexOf(d.day)]}</h3>
            <span class="muted">${Math.round(day.k)} ккал · ${kbzhu(day)} · ${fmt(dayCost)}</span>
          </div>
          ${d.meals.map((m, mi) => {
            const ds = dish(m.dishId);
            return `
            <div class="meal">
              <div class="meal-top">
                ${thumb(ds)}
                <span class="tag">${MEALS[m.type]}</span>
                <b>${ds.n}</b>
                <span class="muted">${ds.k} ккал · ${kbzhu(ds)} · ${fmt(dishCostTotal(ds))}</span>
                <button class="small" onclick="swapDish(${di}, ${mi})">🔄 Заменить</button>
              </div>
              <details>
                <summary>Рецепт и состав</summary>
                <ul>${ds.g.map(([n, g]) => `<li>${n} — ${fmtG(g * state.persons)}</li>`).join('')}</ul>
                <p>${ds.s}</p>
                <a href="https://yandex.ru/search/?text=${encodeURIComponent('рецепт ' + ds.n)}" target="_blank">Подробный рецепт в интернете ↗</a>
              </details>
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
      <div class="nav">
        <button class="ghost" onclick="go(5)">← Изменить блюда</button>
        <button onclick="go(7)">Итог и список покупок →</button>
      </div>
    </section>`;
  },

  7: () => {
    const list = shoppingList();
    const total = totalCost();
    const toBuy = list.filter(x => !state.owned[x.name]).reduce((s, x) => s + x.cost, 0);
    const left = state.budget - toBuy;
    const days = state.plan.length;
    const avgKcal = Math.round(state.plan.reduce((s, d) => s + sumDay(d.meals).k, 0) / days);
    const avgProt = Math.round(state.plan.reduce((s, d) => s + sumDay(d.meals).b, 0) / days);
    const perPersonDay = total / state.persons / days;

    return `
    <section>
      <div class="card">
        <h2>7. Итог</h2>
        <div class="stats">
          <div><span class="muted">Бюджет</span><b>${fmt(state.budget)}</b></div>
          <div><span class="muted">Стоимость меню</span><b>${fmt(total)}</b></div>
          <div><span class="muted">К покупке (без «есть дома»)</span><b>${fmt(toBuy)}</b></div>
          <div><span class="muted">Остаток бюджета</span><b class="${left<0?'bad':'good'}">${fmt(left)}</b></div>
          <div><span class="muted">Ккал в день (1 чел.)</span><b>≈ ${avgKcal}</b></div>
          <div><span class="muted">Белки в день (1 чел.)</span><b>≈ ${avgProt} г</b></div>
          <div><span class="muted">На 1 чел. в день</span><b>${fmt(perPersonDay)}</b></div>
        </div>
        ${total > state.budget ? '<div class="alert">⚠️ Меню дороже бюджета. Замените дорогие блюда или увеличьте бюджет.</div>' : ''}
      </div>

      <div class="card">
        <h3>Список покупок</h3>
        <p class="muted">Отметьте продукты, которые уже есть дома, — они исключатся из списка и из суммы.</p>
        <table>
          <tr><th></th><th>Продукт</th><th>Количество</th><th>Цена</th></tr>
          ${list.map(x => `
            <tr class="${state.owned[x.name]?'owned':''}">
              <td><input type="checkbox" ${state.owned[x.name]?'checked':''} onchange="toggleOwned('${x.name}')"></td>
              <td>${x.name}</td>
              <td>${fmtG(x.g)}</td>
              <td>${state.owned[x.name] ? '<s>'+fmt(x.cost)+'</s> 0 ₽' : fmt(x.cost)}</td>
            </tr>`).join('')}
        </table>
        <div class="chips" style="margin-top:12px">
          <button class="ghost" onclick="copyList()">📋 Копировать</button>
          <button class="ghost" onclick="downloadList()">⬇️ Скачать .txt</button>
          ${navigator.share ? '<button class="ghost" onclick="shareList()">📤 Поделиться</button>' : ''}
        </div>
      </div>

      <div class="nav">
        <button class="ghost" onclick="go(6)">← К меню</button>
        <div>
          <button class="ghost" onclick="window.print()">🖨 Печать</button>
          <button onclick="resetAll()">Начать заново</button>
        </div>
      </div>
    </section>`;
  }
};

function historyScreen() {
  if (!state.history.length) return `
    <section class="card"><h2>История меню</h2>
      <p class="muted">Здесь появятся меню, которые вы составили. Хранятся последние 20.</p></section>`;
  return `
    <section class="card"><h2>История меню</h2>
      ${state.history.map((h, i) => `
        <div class="dish-card">
          <div class="info">
            <b>${h.date}</b>
            <div class="muted">${h.persons} чел. · ${h.plan.length} дн. · бюджет ${fmt(h.budget)} · меню ${fmt(h.total)}</div>
          </div>
          <button class="small" onclick="openHistory(${i})">Открыть</button>
          <button class="small ghost" onclick="delHistory(${i})">×</button>
        </div>`).join('')}
    </section>`;
}

function settingsScreen() {
  const allerg = Object.entries(ALLERGENS).map(([k, v]) =>
    `<label class="chip"><input type="checkbox" ${state.block.allergens.includes(k)?'checked':''} onchange="toggleAllergen('${k}', this.checked)"><span>${v.name}</span></label>`).join('');
  const themes = [['light','☀️ Светлая'],['dark','🌙 Тёмная']].map(([k, v]) =>
    `<label class="chip"><input type="radio" name="th" ${state.theme===k?'checked':''} onchange="setTheme('${k}')"><span>${v}</span></label>`).join('');
  const colors = Object.entries(SCHEMES).map(([k, v]) =>
    `<div class="sw ${state.scheme===k?'on':''}" title="${v}" onclick="setScheme('${k}')" style="background:${SCHEME_COLORS[k]}"></div>`).join('');

  return `
    <section class="card">
      <h2>Аллергены и ограничения</h2>
      <p class="muted">Блюда с этими продуктами не попадут в план и в «Что приготовить».</p>
      <div class="chips">${allerg}</div>
      <h3>Нелюбимые продукты</h3>
      <p class="muted">Через запятую, например: грибы, печень, кинза</p>
      <div class="fridge-input">
        <input type="text" id="dis" value="${state.block.dislikes}" placeholder="грибы, печень">
        <button onclick="saveDislikes()">Сохранить</button>
      </div>
    </section>
    <section class="card">
      <h2>Оформление</h2>
      <h3>Тема</h3>
      <div class="chips">${themes}</div>
      <h3>Цвет</h3>
      <div class="opt">${colors}</div>
    </section>
    <section class="card">
      <h2>Цены и установка</h2>
      <p class="muted">Источник цен: ${priceSource}. Чтобы обновить цены, отредактируйте файл prices.json в репозитории (формат: "Продукт": цена за кг).</p>
      <h3>Установка на телефон</h3>
      <p class="muted">Android (Chrome): меню ⋮ → «Установить приложение». iPhone (Safari): «Поделиться» → «На экран «Домой»».</p>
    </section>`;
}

/* ============ РЕНДЕР ============ */
function renderSteps() {
  stepsEl.innerHTML = STEP_NAMES.map((n, i) => {
    const num = i + 1;
    const cls = (num === state.step ? 'active' : '') + (num < state.step ? ' done' : '');
    const click = num <= state.step ? `onclick="go(${num})"` : '';
    return `<div class="step ${cls}" ${click}>${num}. ${n}</div>`;
  }).join('');
}

function thumb(d) {
  const url = `https://loremflickr.com/320/240/${encodeURIComponent(d.kw)}?lock=${d.id}`;
  return `<div class="thumb"><span>${d.i}</span><img src="${url}" alt="${d.n}" loading="lazy" onerror="this.remove()"></div>`;
}

function render() {
  modesEl.innerHTML = [['plan','📅 План'],['fridge','🧺 Что приготовить'],['history','🕘 История'],['settings','⚙️ Настройки']]
    .map(([k, v]) => `<button class="${state.mode===k?'on':''}" onclick="setMode('${k}')">${v}</button>`).join('');
  stepsEl.style.display = state.mode === 'plan' ? 'flex' : 'none';
  if (state.mode === 'plan') { renderSteps(); app.innerHTML = screens[state.step](); }
  else if (state.mode === 'fridge') app.innerHTML = fridgeScreen();
  else if (state.mode === 'history') app.innerHTML = historyScreen();
  else app.innerHTML = settingsScreen();
}

/* ============ ФОН И ЗАПУСК ============ */
const bgEl = document.createElement('div');
bgEl.className = 'bg';
bgEl.innerHTML = Array.from({ length: 22 }, (_, i) =>
  `<span style="left:${(i*37)%100}%;top:${(i*53)%100}%;font-size:${36 + (i*13)%48}px;animation-duration:${10 + i%7}s">${FRUITS[i % FRUITS.length]}</span>`
).join('');
document.body.prepend(bgEl);

applyTheme();
updateDatalist();
render();
loadPrices();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
