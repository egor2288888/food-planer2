<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Food Planer — планировщик питания</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f3f8f2; margin: 0; color: #223; }
  header { background: #2e7d32; color: #fff; padding: 18px; text-align: center; }
  header h1 { margin: 0; font-size: 28px; }
  header p { margin: 4px 0 0; opacity: .9; }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 12px; }
  .step { padding: 6px 12px; border-radius: 20px; background: #dfe9dd; cursor: pointer; font-size: 14px; }
  .step.active { background: #2e7d32; color: #fff; }
  .step.done { background: #a5d6a7; }
  main { max-width: 960px; margin: 0 auto; padding: 12px; }
  .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  h2 { margin-top: 0; }
  button { background: #2e7d32; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-size: 15px; }
  button:hover { opacity: .9; }
  button.ghost { background: #e0e0e0; color: #333; }
  button.small { padding: 4px 10px; font-size: 13px; }
  .nav { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; flex-wrap: wrap; }
  input[type=number] { width: 130px; padding: 8px; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; }
  input[type=range] { width: 100%; margin: 12px 0; }
  .muted { color: #777; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .chip { border: 1px solid #2e7d32; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .chip:has(input:checked) { background: #e8f5e9; }
  .counter { display: flex; align-items: center; gap: 16px; font-size: 24px; }
  .counter span { min-width: 50px; text-align: center; }
  .dishes { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .dish-pick { display: flex; gap: 8px; border: 1px solid #ddd; border-radius: 10px; padding: 8px; cursor: pointer; }
  .day-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  .meal { border-top: 1px solid #eee; padding: 10px 0; }
  .meal-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .meal-top b { flex: 1; min-width: 200px; }
  .tag { background: #fff3e0; color: #e65100; border-radius: 6px; padding: 2px 8px; font-size: 13px; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: #2e7d32; }
  .alert { background: #fff8e1; border-left: 4px solid #ffb300; padding: 10px; border-radius: 8px; margin: 8px 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 10px; }
  .stats div { background: #f6fbf6; padding: 10px; border-radius: 10px; display: flex; flex-direction: column; }
  .stats b { font-size: 20px; }
  .good { color: #2e7d32; } .bad { color: #c62828; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
  tr.owned td { color: #999; }
  tr.owned td:nth-child(2) { text-decoration: line-through; }
  @media print { header, .steps, .nav, button, input[type=checkbox] { display: none; } }
</style>
</head>
<body>
<header>
  <h1>🥗 Food Planer</h1>
  <p>Планируем питание под ваш бюджет</p>
</header>
<div class="steps" id="steps"></div>
<main id="app"></main>

  {id:4, name:'Творожная запеканка', meal:'breakfast', prot:'veg', kcal:390, ing:[['Творог',200],['Яйца',60],['Крупа манная',20],['Сметана',30]], steps:'Смешать творог, яйца, манку и сметану. Выложить в форму, запекать 25 минут при 180°C.'},

/* ============ СОСТОЯНИЕ ============ */
const state = {
  step: 1,
  budget: 5000,
  persons: 2,
  days: [...DAYS],
  snacks: 1,
  diet: 'any',
  kcal: 'normal',
  selected: {},      // id блюда -> false, если убрано
  plan: null,        // [{day, meals:[{type, dishId}]}]
  warnings: [],
  owned: {}          // название продукта -> true, если есть дома
};

/* ============ ХЕЛПЕРЫ ============ */
const app = document.getElementById('app');
const stepsEl = document.getElementById('steps');
const STEP_NAMES = ['Бюджет','Персоны','Дни','Питание','Блюда','Меню','Итог'];

const dish = id => DISHES.find(d => d.id === id);
const fmt = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const fmtG = g => g >= 1000 ? (g/1000).toLocaleString('ru-RU',{maximumFractionDigits:2}) + ' кг' : Math.round(g) + ' г';
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dishCost = d => d.ing.reduce((s,[n,g]) => s + g/1000 * PRICES[n], 0);        // на 1 человека
const dishCostTotal = d => dishCost(d) * state.persons;                              // на всех
const radios = (name, obj, cur) => Object.entries(obj).map(([k,v]) =>
  `<label class="chip"><input type="radio" name="${name}" value="${k}" ${cur===k?'checked':''} onchange="state.${name}=this.value"><span>${v}</span></label>`
).join('');

function dietOk(d, diet) {
  if (diet === 'any')  return true;
  if (diet === 'meat') return d.prot === 'meat';
  if (diet === 'fish') return d.prot === 'fish';
  if (diet === 'mix')  return d.prot === 'meat' || d.prot === 'fish';
  if (diet === 'veg')  return d.prot === 'veg';
  return true;
}

// Пул блюд для категории с учётом выбора пользователя, предпочтений и калорийности
function getPool(type) {
  const warns = [];
  let base = DISHES.filter(d => d.meal === type && state.selected[d.id] !== false);
  if (!base.length) {
    base = DISHES.filter(d => d.meal === type);
    warns.push(`В категории «${MEALS[type]}» не выбрано ни одного блюда — использованы все варианты.`);
  }
  let p = base.filter(d => dietOk(d, state.diet));
  if (!p.length) {
    p = base;
    warns.push(`Для режима «${DIETS[state.diet]}» нет подходящих блюд в категории «${MEALS[type]}» — показаны остальные.`);
  }
  if (state.kcal !== 'normal' && p.length > 2) {
    const s = [...p].sort((a,b) => a.kcal - b.kcal);
    const half = Math.ceil(s.length / 2);
    p = state.kcal === 'more' ? s.slice(half) : s.slice(0, half);
  }
  return { list: p, warns };
}

/* ============ ГЕНЕРАЦИЯ ПЛАНА ============ */
function totalCost() {
  return state.plan.reduce((s, d) =>
    s + d.meals.reduce((a, m) => a + dishCostTotal(dish(m.dishId)), 0), 0);
}

function balanceBudget(pools) {
  let guard = 0;
  while (totalCost() > state.budget && guard++ < 500) {
    let best = null;
    state.plan.forEach(d => d.meals.forEach(m => {
      const cur = dishCostTotal(dish(m.dishId));
      const alt = pools[m.type].filter(x => dishCostTotal(x) < cur);
      if (alt.length && (!best || cur > best.cur)) best = { m, cur, alt };
    }));
    if (!best) break;
    best.m.dishId = best.alt.reduce((a,b) => dishCostTotal(b) < dishCostTotal(a) ? b : a).id;
  }
}

function generatePlan() {
  state.warnings = [];
  const pools = {};
  ['breakfast','lunch','dinner','snack'].forEach(t => {
    const r = getPool(t);
    pools[t] = r.list;
    r.warns.forEach(w => { if (!state.warnings.includes(w)) state.warnings.push(w); });
  });

  state.plan = state.days.map(day => {
    const meals = [];
    ['breakfast','lunch','dinner'].forEach(t => meals.push({ type:t, dishId: pick(pools[t]).id }));
    for (let i = 0; i < state.snacks; i++) meals.push({ type:'snack', dishId: pick(pools.snack).id });
    return { day, meals };
  });

  balanceBudget(pools);

  if (totalCost() > state.budget) {
    const minPer = t => Math.min(...pools[t].map(dishCostTotal));
    const minTotal = state.plan.reduce((s,d) =>
      s + d.meals.reduce((a,m) => a + minPer(m.type), 0), 0);
    state.warnings.push(`Бюджет слишком мал: минимальная стоимость меню с этими условиями ≈ ${fmt(minTotal)}. Увеличьте бюджет или уберите часть дней/перекусов.`);
  }
}

function toMenu() { generatePlan(); go(6); }

function swapDish(di, mi) {
  const m = state.plan[di].meals[mi];
  const others = getPool(m.type).list.filter(d => d.id !== m.dishId);
  if (!others.length) return alert('Для этой категории нет других блюд. Добавьте варианты на шаге 5.');
  m.dishId = pick(others).id;
  render();
}

function shoppingList() {
  const map = {};
  state.plan.forEach(d => d.meals.forEach(m =>
    dish(m.dishId).ing.forEach(([n,g]) => map[n] = (map[n] || 0) + g * state.persons)));
  return Object.entries(map)
    .map(([name,g]) => ({ name, g, cost: g/1000 * PRICES[name] }))
    .sort((a,b) => b.cost - a.cost);
}

function toggleOwned(name) { state.owned[name] = !state.owned[name]; render(); }

/* ============ УПРАВЛЕНИЕ ЭКРАНАМИ ============ */
function setBudget(v) {
  let n = Math.round(+v); if (!n || n < 1) n = 1; if (n > 50000) n = 50000;
  state.budget = n;
  document.getElementById('bRange').value = n;
  document.getElementById('bNum').value = n;
  document.getElementById('bDay').textContent = `≈ ${fmt(n / Math.max(1, state.days.length))} в день (дней выбрано: ${state.days.length})`;
}
function setPersons(d) {
  state.persons = Math.min(10, Math.max(1, state.persons + d));
  document.getElementById('pVal').textContent = state.persons;
}
function toggleDay(d, on) {
  state.days = DAYS.filter(x => x === d ? on : state.days.includes(x));
}
function selectAll(meal, on) {
  DISHES.filter(d => d.meal === meal).forEach(d => state.selected[d.id] = on);
  render();
}
function go(n) {
  state.step = n;
  render();
  window.scrollTo({ top: 0 });
}
function resetAll() { location.reload(); }

const screens = {
  1: () => `
    <section class="card">
      <h2>1. Бюджет на весь период</h2>
      <p class="muted">Сколько готовы потратить на питание за все выбранные дни (от 1 до 50 000 ₽)</p>
      <input type="range" id="bRange" min="1" max="50000" step="1" value="${state.budget}" oninput="setBudget(this.value)">
      <div class="chips" style="align-items:center">
        <input type="number" id="bNum" min="1" max="50000" value="${state.budget}" onchange="setBudget(this.value)"> <b>₽</b>
      </div>
      <p class="muted" id="bDay">≈ ${fmt(state.budget / Math.max(1,state.days.length))} в день (дней выбрано: ${state.days.length})</p>
      <div class="nav"><span></span><button onclick="go(2)">Далее →</button></div>
    </section>`,

  2: () => `
    <section class="card">
      <h2>2. Количество персон</h2>
      <p class="muted">Для скольких человек готовим (от 1 до 10)</p>
      <div class="counter">
        <button onclick="setPersons(-1)">−</button>
        <span id="pVal">${state.persons}</span>
        <button onclick="setPersons(1)">+</button>
      </div>
      <div class="nav"><button class="ghost" onclick="go(1)">← Назад</button><button onclick="go(3)">Далее →</button></div>
    </section>`,

  3: () => `
    <section class="card">
      <h2>3. Дни недели</h2>
      <p class="muted">На какие дни нужно меню</p>
      <div class="chips">
        ${DAYS.map((d,i) => `
          <label class="chip"><input type="checkbox" ${state.days.includes(d)?'checked':''}
            onchange="toggleDay('${d}', this.checked)"><span>${DAYS_FULL[i]}</span></label>`).join('')}
      </div>
      <div class="nav">
        <button class="ghost" onclick="go(2)">← Назад</button>
        <button onclick="state.days.length ? go(4) : alert('Выберите хотя бы один день')">Далее →</button>
      </div>
    </section>`,

  4: () => `
    <section class="card">
      <h2>4. Перекусы и предпочтения</h2>
      <h3>Перекусов в день</h3>
      <div class="chips">
        ${[0,1,2,3].map(n => `
          <label class="chip"><input type="radio" name="snacks" value="${n}" ${state.snacks===n?'checked':''}
            onchange="state.snacks=+this.value"><span>${n}</span></label>`).join('')}
      </div>
      <h3>Что едим</h3>
      <div class="chips">${radios('diet', DIETS, state.diet)}</div>
      <h3>Калорийность</h3>
      <div class="chips">${radios('kcal', KCAL, state.kcal)}</div>
      <div class="nav">
        <button class="ghost" onclick="go(3)">← Назад</button>
        <button onclick="go(5)">Далее →</button>
      </div>
    </section>`,

  5: () => `
    <section class="card">
      <h2>5. Выберите блюда</h2>
      <p class="muted">В каждой категории 10 вариантов. Снимите галочки с тех, которые не хотите видеть в меню.</p>
      ${Object.entries(MEALS).map(([k,label]) => `
        <h3>${label}
          <button class="small" onclick="selectAll('${k}', true)">Все</button>
          <button class="small ghost" onclick="selectAll('${k}', false)">Ни одного</button>
        </h3>
        <div class="dishes">
          ${DISHES.filter(d => d.meal === k).map(d => `
            <label class="dish-pick">
              <input type="checkbox" ${state.selected[d.id]!==false?'checked':''}
                onchange="state.selected[${d.id}] = this.checked">
              <div>
                <b>${d.name}</b>
                <div class="muted">${d.kcal} ккал · ${fmt(dishCost(d))} на 1 чел. · ${PROT[d.prot]}</div>
              </div>
            </label>`).join('')}
        </div>`).join('')}
      <div class="nav">
        <button class="ghost" onclick="go(4)">← Назад</button>
        <button onclick="toMenu()">Составить меню →</button>
      </div>
    </section>`,

  6: () => {
    const warn = state.warnings.map(w => `<div class="alert">⚠️ ${w}</div>`).join('');
    return `
    <section>
      <div class="card">
        <h2>6. Ваше меню</h2>
        <p class="muted">Персон: ${state.persons} · дней: ${state.days.length} · перекусов в день: ${state.snacks} · ${DIETS[state.diet]} · ${KCAL[state.kcal]} · бюджет ${fmt(state.budget)}</p>
        ${warn}
        <p class="muted">Стоимость и ккал в карточках указаны на весь набор персон (ккал — на 1 порцию).</p>
      </div>
      ${state.plan.map((d, di) => {
        const dayKcal = d.meals.reduce((s,m) => s + dish(m.dishId).kcal, 0);
        const dayCost = d.meals.reduce((s,m) => s + dishCostTotal(dish(m.dishId)), 0);
        return `
        <div class="card">
          <div class="day-head">
            <h3>${DAYS_FULL[DAYS.indexOf(d.day)]}</h3>
            <span class="muted">${dayKcal} ккал на 1 чел. · ${fmt(dayCost)}</span>
          </div>
          ${d.meals.map((m, mi) => {
            const ds = dish(m.dishId);
            return `
            <div class="meal">
              <div class="meal-top">
                <span class="tag">${MEALS[m.type]}</span>
                <b>${ds.name}</b>
                <span class="muted">${ds.kcal} ккал · ${fmt(dishCostTotal(ds))}</span>
                <button class="small" onclick="swapDish(${di}, ${mi})">🔄 Заменить</button>
              </div>
              <details>
                <summary>Рецепт и состав</summary>
                <ul>${ds.ing.map(([n,g]) => `<li>${n} — ${fmtG(g * state.persons)}</li>`).join('')}</ul>
                <p>${ds.steps}</p>
                <a href="https://yandex.ru/search/?text=${encodeURIComponent('рецепт ' + ds.name)}" target="_blank">Подробный рецепт в интернете ↗</a>
              </details>
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
      <div class="nav">
        <button class="ghost" onclick="go(5)">← Изменить блюда</button>
        <button onclick="go(7)">Итог и список покупок →</button>
      </div>
    </section>`;
  },

  7: () => {
    const list = shoppingList();
    const total = totalCost();
    const toBuy = list.filter(x => !state.owned[x.name]).reduce((s,x) => s + x.cost, 0);
    const left = state.budget - toBuy;
    const avgKcal = Math.round(state.plan.reduce((s,d) =>
      s + d.meals.reduce((a,m) => a + dish(m.dishId).kcal, 0), 0) / state.plan.length);
    const perPersonDay = total / state.persons / state.plan.length;

    return `
    <section>
      <div class="card">
        <h2>7. Итог</h2>
        <div class="stats">
          <div><span class="muted">Бюджет</span><b>${fmt(state.budget)}</b></div>
          <div><span class="muted">Стоимость меню</span><b>${fmt(total)}</b></div>
          <div><span class="muted">К покупке (без «есть дома»)</span><b>${fmt(toBuy)}</b></div>
          <div><span class="muted">Остаток бюджета</span><b class="${left<0?'bad':'good'}">${fmt(left)}</b></div>
          <div><span class="muted">Ккал в день (1 чел.)</span><b>≈ ${avgKcal}</b></div>
          <div><span class="muted">Стоимость на 1 чел. в день</span><b>${fmt(perPersonDay)}</b></div>
        </div>
        ${total > state.budget ? '<div class="alert">⚠️ Меню дороже бюджета. Замените дорогие блюда или увеличьте бюджет.</div>' : ''}
      </div>

      <div class="card">
        <h3>Список покупок</h3>
        <p class="muted">Отметьте продукты, которые уже есть дома — они будут исключены из списка и из суммы.</p>
        <table>
          <tr><th></th><th>Продукт</th><th>Количество</th><th>Цена</th></tr>
          ${list.map(x => `
            <tr class="${state.owned[x.name]?'owned':''}">
              <td><input type="checkbox" ${state.owned[x.name]?'checked':''} onchange="toggleOwned('${x.name}')"></td>
              <td>${x.name}</td>
              <td>${fmtG(x.g)}</td>
              <td>${state.owned[x.name] ? '<s>'+fmt(x.cost)+'</s> 0 ₽' : fmt(x.cost)}</td>
            </tr>`).join('')}
        </table>
      </div>

      <div class="nav">
        <button class="ghost" onclick="go(6)">← К меню</button>
        <div>
          <button class="ghost" onclick="window.print()">🖨 Печать</button>
          <button onclick="resetAll()">Начать заново</button>
        </div>
      </div>
    </section>`;
  }
};

/* ============ РЕНДЕР ============ */
function renderSteps() {
  stepsEl.innerHTML = STEP_NAMES.map((n,i) => {
    const num = i + 1;
    const cls = (num === state.step ? 'active' : '') + (num < state.step ? ' done' : '');
    const click = num <= state.step ? `onclick="go(${num})"` : '';
    return `<div class="step ${cls}" ${click}>${num}. ${n}</div>`;
  }).join('');
}

function render() {
  renderSteps();
  app.innerHTML = screens[state.step]();
}

render();
</script>
</body>
</html>
